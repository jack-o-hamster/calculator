<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Калькулятор</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="calculator">
      <div id="display">0</div>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>*</button>
      <br />
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button id="reject">/</button>
      <br />
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button id="equals">=</button>
      <br />
      <button>+</button>
      <button>0</button>
      <button>-</button>
      <button id="clear">C</button>
    </div>
  </body>
</html>
